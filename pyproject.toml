[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-control"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for desktop GUI automation, screen perception, and window management on Linux and Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0",
    "mss>=10.2.0",
    "pillow>=10.0.0",
    "pynput>=1.8.2",
    "python-xlib>=0.33",
    "pydantic>=2.10.0",
    "opencv-python-headless>=4.8.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Local OCR lane. Linux/Windows: PP-OCRv4 ONNX models bundled in the wheel (~16 MB).
ocr = [
    "rapidocr_onnxruntime>=1.3; sys_platform != 'darwin'",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
desktop-control = "vision_mcp.server:main"
vision-mcp = "vision_mcp.server:main"

[tool.setuptools.packages.find]
include = ["vision_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
