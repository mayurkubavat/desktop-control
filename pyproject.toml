[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-control-mcp"
version = "0.1.0"
description = "Vision Control MCP Server for autonomous Linux UI and desktop navigation with multimodal AI feedback loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0",
    "mss>=10.2.0",
    "pillow>=10.0.0",
    "pynput>=1.8.2",
    "python-xlib>=0.33",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
vision-mcp = "vision_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
